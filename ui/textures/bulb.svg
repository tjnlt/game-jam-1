<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Tank Body Gradient -->
    <linearGradient id="redTank" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="30%" stop-color="#DC143C" />
      <stop offset="70%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    
    <!-- Metallic Valve Gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#708090" />
      <stop offset="50%" stop-color="#E6E6FA" />
      <stop offset="100%" stop-color="#4682B4" />
    </linearGradient>
    
    <!-- Gauge Gradient -->
    <linearGradient id="gaugeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
  </defs>

  <!-- Tank Shadow -->
  <ellipse cx="100" cy="188" rx="35" ry="6" fill="#000000" opacity="0.2" />

  <!-- Main Tank Body -->
  <path d="M 70 65 
           A 30 30 0 0 1 130 65 
           L 130 165 
           A 15 15 0 0 1 115 180 
           L 85 180 
           A 15 15 0 0 1 70 165 
           Z" 
        fill="url(#redTank)" />

  <!-- High-gloss Highlight -->
  <path d="M 78 60 
           A 22 22 0 0 1 100 45 
           L 100 175 
           L 88 175 
           A 10 10 0 0 1 78 165 
           Z" 
        fill="#ffffff" opacity="0.25" />

  <!-- O2 Text Label -->
  <text x="100" y="125" 
        font-family="Arial, sans-serif" 
        font-weight="900" 
        font-size="28" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.9"
        letter-spacing="1">O₂</text>

  <!-- Neck -->
  <rect x="92" y="36" width="16" height="10" fill="url(#metal)" rx="1" />

  <!-- Main Valve Base -->
  <rect x="88" y="26" width="24" height="10" fill="url(#metal)" rx="2" />

  <!-- Top Valve Knob -->
  <path d="M 85 22 L 115 22 L 112 16 L 88 16 Z" fill="url(#metal)" />
  <circle cx="100" cy="19" r="3" fill="#333" />

  <!-- Pressure Gauge (Right side) -->
  <path d="M 112 31 L 122 31" stroke="url(#metal)" stroke-width="4" stroke-linecap="round" />
  <circle cx="127" cy="31" r="9" fill="url(#gaugeBg)" stroke="#555" stroke-width="1.5" />
  <!-- Gauge Needle (Green/Normal Zone) -->
  <circle cx="127" cy="31" r="7" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="11 20" transform="rotate(-45 127 31)" />
  <line x1="127" y1="31" x2="131" y2="26" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="127" cy="31" r="1.5" fill="#333" />

  <!-- Outlet Nozzle (Left side) -->
  <path d="M 88 31 L 80 31" stroke="url(#metal)" stroke-width="5" stroke-linecap="round" />
</svg>
